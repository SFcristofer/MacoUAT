<template>
    <lightning-modal-header label="Agregar Producto"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-tabset>

            <!-- //////////////// -->
            <!--      Buscar      -->
            <!-- //////////////// -->
            <lightning-tab label="Buscar">
                <c-sales-maco-search
                    onaddproducts={sendProductsToWrapper}
                    pricebookid={pricebookid}
                    almacenid={almacenId}
                    allowwarehousechange={allowwarehousechange}
                    allowheaderedit={allowheaderedit}
                    recordid={recordid}
                    orderheader={orderheader}
                    searchpurpose="add"
                ></c-sales-maco-search>
            </lightning-tab>

            <!-- //////////////// -->
            <!-- Product Generico -->
            <!-- //////////////// -->
            <lightning-tab label="Producto Generico" title="2nd tab extended title">
                <div class="slds-p-around_medium">
                    <lightning-input type="text" label="Descripción del producto" name="name" placeholder="Nombre del producto" value={formData.name} required variant="standard"  onchange={changeHandler}></lightning-input>
                    <lightning-input type="string" label="Cantidad" name="quantity" value={formData.quantity} variant="standard"  onchange={changeHandler}></lightning-input>
                    <lightning-input type="number" label="Precio" name="price" formatter="number" step="0.01" value={formData.price} required variant="standard"  onchange={changeHandler}></lightning-input>
                </div>
                <div class="ct-margin-left">
                    <lightning-button 
                        label="Agregar" 
                        title="Non-primary action" 
                        onclick={addGenericProduct} 
                        class="slds-m-left_x-small">
                    </lightning-button>
                    <lightning-button 
                        label="Cancel" 
                        variant="destructive-text"
                        title="Non-primary action" 
                        onclick={handleCancel} 
                        class="slds-m-left_x-small">
                    </lightning-button>
                </div>
            </lightning-tab>
        </lightning-tabset>
    </lightning-modal-body>
</template>
